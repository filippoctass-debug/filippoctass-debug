services:
  edge-driver:
    image: ghcr.io/filippoctass-debug/edge-driver:latest
    restart: always
    network_mode: host
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    env_file:
      - .env

  watchtower:
    image: containrrr/watchtower:latest
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: >
      --label-enable
      --interval 30
      --cleanup

