services:
  edge-driver:
     image: ghcr.io/filippoctass-debug/edge-driver:latest
     restart: unless-stopped
     env_file:
       - .env
     volumes:
       - ./certs:/certs:ro
  watchtower:
    image: containrrr/watchtower:latest
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: >
      --label-enable
      --interval 30
      --cleanup

