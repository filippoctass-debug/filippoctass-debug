name: Build & Push edge-driver (multi-arch)

on:
  push:
    branches: [ "main" ]
    paths:
      - "edge/**"
      - ".github/workflows/edge-driver.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push (amd64+arm64)
        uses: docker/build-push-action@v6
        with:
          context: ./edge
          push: true
          tags: ghcr.io/filippoctass-debug/edge-driver:latest
          platforms: linux/amd64,linux/arm64
