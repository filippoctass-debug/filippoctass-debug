name: Build and Push Images to GHCR

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push control-room-api
        uses: docker/build-push-action@v6
        with:
          context: ./cloud/fastapi
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/control-room-api:latest

      - name: Build & Push edge-driver (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: ./edge
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository_owner }}/edge-driver:latest
